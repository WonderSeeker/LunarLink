; -*- coding: utf-8 -*-
; ============================================================================
; LunarLink 测试工程 pytest 配置
; ============================================================================
; 用法（★ 必须用 backend/.venv 的解释器，且必须在 lunarlink_tests 目录下执行）：
;     cd lunarlink_tests
;     ..\backend\.venv\Scripts\python.exe -m pytest --alluredir=allure-results --html=report.html --self-contained-html
;
; 为什么显式钉 rootdir：
;     仓库里还有一个 Django 项目（backend/），不钉 rootdir 可能被向上找到的
;     其他配置干扰，导致收集范围/插件行为不符合预期。pytest.ini 放在本目录，
;     pytest 就会把 rootdir 定在这里。
;
; 为什么用 `python -m pytest` 而不是裸 `pytest`：
;     确保使用的是 backend/.venv 里那套解释器与依赖，避免误用全局 Python。

[pytest]
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

; -ra 显示 skip/xfail 等非通过用例的简短原因；-q 精简输出
addopts = -ra -q

markers =
    smoke: 冒烟用例（快速、必过、可作为提交前自检）
    regression: 回归用例（默认全量回归范围）
    negative: 异常流用例（非法入参、非法状态流转、资源不存在）
    boundary: 边界值用例（分页边界、数量边界、长度边界）
    concurrency: 并发与幂等用例（超卖、重复回调）
    security: 鉴权与越权用例
    platform: LunarLink 平台自身 API 的冒烟套件（与业务套件分开统计）
