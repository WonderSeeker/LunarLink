# -*- coding: utf-8 -*-
# ============================================================================
# 每日回归：定时 + 手动触发
# ============================================================================
# 触发方式：
#   * schedule          —— 每日 UTC 18:00（北京 02:00）跑一次
#   * workflow_dispatch —— 在 Actions 页面手动点 "Run workflow"
#
# 产物（都可在 Actions 页面的 Artifacts 里下载）：
#   1. regression-report-allure/  —— Allure HTML（可直接打开）
#   2. regression-report-pytest/  —— pytest-html 自包含 HTML（本地也能看）
#   3. logs/                      —— SUT 启动日志与 /health 快照（排障用）
#
# ★ 关于两个被测对象（重要）
#   本仓库的套件同时测两个东西，所以 CI 要起【两个服务】：
#
#     1) sut/        FastAPI mock 电商  :8021   → test_00 ~ test_08（175 条，业务套件）
#     2) backend/    LunarLink 平台本体 :8001   → test_09（26 条，平台冒烟，platform marker）
#
#   SUT 启动时必须带 SUT_ENABLE_TEST_HOOKS=1，否则依赖测试后门的用例
#   （过期 token、锁定到期）会因为拿不到后门而 skip —— 那是一种「假的绿色」。
#
#   平台侧启动有两个坑，都是实测踩出来的（见下面各 step 的注释）：
#     a) backend/.env 被 gitignore，CI 里不存在，而 conf/env.py 里有
#        `PROXY_PORT = int(os.getenv("PROXY_PORT"))`（无默认值）→ 缺它直接 ImportError。
#        所以要先 `cp .env.example .env`。
#     b) 但 .env.example 的 REDIS_ON/PROXY_ON 是 True（本地 .env 是 False），
#        直接用会去连本地没有的 Redis/MQ。所以这几个开关必须在 job env 里显式覆盖。
#        （load_dotenv() 默认不覆盖已存在的环境变量，所以 job env 优先级更高。）
# ============================================================================

name: 每日回归

on:
  schedule:
    # UTC 18:00 = 北京时间 02:00，避开白天占用
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      marker:
        description: "只跑某个 marker（留空 = 全量）"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  regression:
    name: 接口回归（SUT 175 条）
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements-test.txt

      - name: 安装测试依赖
        run: |
          python -m pip install --upgrade pip
          # ★ 只装测试依赖；backend/requirements.txt 是后端运行环境，CI 不需要
          pip install -r backend/requirements-test.txt
          pip list

      - name: 重建 SUT 数据库并灌种子数据
        # seed.py 是幂等的（--reset 会删库重建），所以不依赖任何手工造数据
        run: python sut/seed.py --reset

      - name: 启动 SUT 并等待就绪
        env:
          # ★ 必须开：否则「token 过期」「锁定到期」两组用例会 skip（假的绿色）
          SUT_ENABLE_TEST_HOOKS: "1"
        run: |
          mkdir -p logs
          nohup python sut/run.py > logs/sut.out 2>&1 &
          echo "SUT 已在后台启动（pid=$!）"
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8021/health > logs/health.json; then
              echo "SUT 就绪（第 ${i} 次探测）"
              cat logs/health.json
              exit 0
            fi
            sleep 1
          done
          echo "::error::SUT 在 30 秒内没有就绪"
          cat logs/sut.out
          exit 1

      - name: 准备平台数据库与冒烟账号
        env:
          # ★ settings.py 里 DATABASE_ENGINE 默认是 mysql；CI 没有 MySQL，必须显式给 sqlite
          DATABASE_ENGINE: sqlite
          # 与「已知可用的本地 .env」对齐，避免去连不存在的 Redis / 录制代理
          REDIS_ON: "False"
          PROXY_ON: "False"
          PROXY_PORT: "7778"
        working-directory: backend
        run: |
          # ★ 必须先有 .env：conf/env.py 在 import 期就会执行
          #   `PROXY_PORT = int(os.getenv("PROXY_PORT"))`，缺它直接崩，Django 起不来。
          cp .env.example .env
          python manage.py migrate --noinput
          # 幂等地准备两个冒烟账号：非管理员（主力）+ 管理员（admin-only 端点）
          python manage.py ensure_smoke_user

      - name: 启动平台并等待就绪
        env:
          DATABASE_ENGINE: sqlite
          REDIS_ON: "False"
          PROXY_ON: "False"
          PROXY_PORT: "7778"
        run: |
          cd backend
          nohup python manage.py runserver 127.0.0.1:8001 --noreload > ../logs/lunar-be.out 2>&1 &
          echo "平台已在后台启动（pid=$!）"
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8001/login/ || true)
            # /login/ 只接受 POST，GET 会回 405 —— 只要不是 000，就说明服务已起来
            if [ "$code" != "000" ] && [ -n "$code" ]; then
              echo "平台就绪（第 ${i} 次探测，HTTP $code）"
              exit 0
            fi
            sleep 1
          done
          echo "::error::LunarLink 平台在 40 秒内没有就绪"
          cat ../logs/lunar-be.out
          exit 1

      - name: 执行 pytest
        working-directory: lunarlink_tests
        # ★ 用 `python -m pytest` 而不是裸 pytest，保证用的是当前解释器
        # ★ marker 为空时不传 -m：`-m ""` 在部分 pytest 版本上会被当成非法表达式
        run: |
          COMMON="--alluredir=allure-results --html=report.html --self-contained-html --junitxml=junit.xml"
          MARKER="${{ github.event.inputs.marker }}"
          if [ -n "$MARKER" ]; then
            echo ">>> 只跑 marker: $MARKER"
            python -m pytest $COMMON -m "$MARKER"
          else
            echo ">>> 全量执行"
            python -m pytest $COMMON
          fi

      - name: 生成 Allure HTML
        if: always()
        # 说明：这里没有用 third-party 的 Allure Action，而是直接用官方 allure CLI
        #   （npm 包 allure-commandline，runner 上 Node 与 Java 都是预装的）。
        #   原因：simple-elf/allure-report-action 是 `using: docker` 且以「部署到 gh-pages
        #   并保留历史」为目标，而我们只要一份可下载的 HTML；用官方 CLI 每一步都可读、
        #   不引入无法在本地验证的第三方依赖。
        #   若你更想用那个 Action，替换下面这段即可（入参名称已核实）：
        #     - uses: simple-elf/allure-report-action@master
        #       with:
        #         allure_results: lunarlink_tests/allure-results
        #         allure_report: allure-report
        #         allure_history: allure-history
        #         gh_pages: gh-pages
        #         keep_reports: 20
        run: |
          npm install -g allure-commandline --silent
          allure --version
          # ★ 这里刻意【不加】 `|| true`：报告流水线坏掉本来就该是红的。
          #   若加 `|| true`，会出现「测试全绿但报告悄悄没了」这种最坏情况。
          allure generate lunarlink_tests/allure-results -o allure-report --clean
          ls -la allure-report | head -20

      - name: 输出用例统计
        if: always()
        working-directory: lunarlink_tests
        run: |
          echo "=== junit 汇总 ==="
          python - <<'PY'
          import glob, json, collections, os
          c = collections.Counter()
          for p in glob.glob("allure-results/*-result.json"):
              with open(p, encoding="utf-8") as fp:
                  c[json.load(fp).get("status")] += 1
          print("allure 用例统计:", dict(c), "总计:", sum(c.values()))
          PY

      - name: 上传报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-report-allure
          path: allure-report
          if-no-files-found: warn
          retention-days: 30

      - name: 上传 pytest-html 与日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-report-pytest
          path: |
            lunarlink_tests/report.html
            lunarlink_tests/junit.xml
            logs
          if-no-files-found: warn
          retention-days: 30
