# -*- coding: utf-8 -*-
# ============================================================================
# 每日回归：定时 + 手动触发
# ============================================================================
# 触发方式：
#   * schedule          —— 每日 UTC 18:00（北京 02:00）跑一次
#   * workflow_dispatch —— 在 Actions 页面手动点 "Run workflow"
#   * push (main)       —— 推送到 main 时跑；纯文档/截图改动不触发（paths-ignore）
#
# 产物（都可在 Actions 页面的 Artifacts 里下载）：
#   1. regression-report-allure/  —— Allure HTML（可直接打开）
#   2. regression-report-pytest/  —— pytest-html 自包含 HTML（本地也能看）
#   3. logs/                      —— SUT 启动日志与 /health 快照（排障用）
#
# ★ 本 job 只跑【一个】被测对象：sut/（FastAPI mock 电商，175 条）
#
#   本仓库的套件其实覆盖两个被测对象，但本 job 只起 sut/：
#     1) sut/      :8021  → test_00 ~ test_08（175 条）  ← 本 job 跑这个
#     2) backend/  :8001  → test_09（26 条，platform）  ← 【不在本 job】，原因见
#                                                          下面 step 里的说明与文件末尾
#
#   SUT 启动时必须带 SUT_ENABLE_TEST_HOOKS=1，否则依赖测试后门的用例
#   （过期 token、锁定到期）会因为拿不到后门而 skip —— 那是一种「假的绿色」。
#
# ★ 如果将来你想加一个 job 去跑平台冒烟，下面两个坑必须处理（都实测踩过）：
#     a) backend/.env 被 gitignore，CI 里不存在，而 conf/env.py 里有
#        `PROXY_PORT = int(os.getenv("PROXY_PORT"))`（无默认值）→ 缺它直接 ImportError。
#        所以要先 `cp .env.example .env`。
#     b) 但 .env.example 的 REDIS_ON/PROXY_ON 是 True（本地 .env 是 False），
#        直接用会去连本地没有的 Redis/MQ。所以这几个开关要在 job env 里显式覆盖。
#        （load_dotenv() 默认不覆盖已存在的环境变量，所以 job env 优先级更高。）
# ============================================================================

name: 每日回归

on:
  schedule:
    # UTC 18:00 = 北京时间 02:00，避开白天占用
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      marker:
        description: "只跑某个 marker（留空 = 全量）"
        required: false
        default: ""
  push:
    branches: [main]
    # 纯文档改动不触发回归（省的浪费 Actions 配额；public 仓库虽免费但没必要）
    paths-ignore:
      - "**.md"
      - "screenshots/**"

permissions:
  contents: read

jobs:
  regression:
    name: 接口回归（SUT 175 条）
    # ★ 钉住具体版本而不是 ubuntu-latest。
    #   原因：GitHub 会改 ubuntu-latest 指向的镜像（当前 = 24.04，公告 2026-10-19 起迁到 26.04）。
    #   而 runner 换了之后系统依赖可能变化 → 一个跟代码无关的外部变更就能让 CI 突然变红。
    #   钉住后，镜像升级由我们主动选时机，而不是被动挨一下。
    #   （已核实 ubuntu-24.04 是有效 label：runner-images README 里明确列着它。）
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # ★ 显式把 Python 的 I/O 编码钉成 UTF-8。
      #   本仓库的输出里有中文（用例标题、失败摘要、step summary），
      #   而 runner 的 locale 不保证是 UTF-8；一旦被按别的编码写出去，
      #   annotation 与 summary 里的中文就会变成乱码。
      #   （本机用 bash 预演这个 step 时确实出现过乱码，所以不赌"理论上没问题"。）
      PYTHONIOENCODING: utf-8

    steps:
      - name: 检出代码
        # ★ 统一升到【第一个声明 Node 24 的大版本】v6，而不是直接跳最新。
        #   起因：GitHub 报 "Node.js 20 is deprecated ... forced to run on Node.js 24"。
        #   已核算过可用大版本：checkout 有 v1..v7（最新 v7.0.1），
        #   但 v6 就已经是 Node 24（v6.0.0 release note: "Node.js 24 support"），
        #   本流程没用它任何输入，所以取"够用的最小大版本"即可。
        uses: actions/checkout@v6

      - name: 安装 Python 3.10
        # ★ setup-python 特意【停在 v6，不上 v7】—— 这是一个有依据的决定：
        #   v6.0.0 的破坏性变更就是"升级到 node 24"，正好解决警告；
        #   而 v7.0.0 的 release note 里有一条 "Remove EOL Python versions"，
        #   而 Python 3.10 恰好在 2026-10 EOL → 上 v7 有让 python-version: 3.10
        #   直接装不上的风险。本项目后端 venv 是 3.10.11，CI 要对齐它。
        #   （若要上 v7，应先确认 3.10 仍在 python-versions 的 manifest 里。）
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements-test.txt

      - name: 安装测试依赖
        run: |
          python -m pip install --upgrade pip
          # ★ 只装测试依赖；backend/requirements.txt 是后端运行环境，CI 不需要。
          #   这不是图省事：requirements-test.txt 头部明确写着
          #   「与 backend/requirements.txt 完全隔离，禁止合并（后者是后端运行时依赖）」。
          #   实测把两者装进同一个环境后，原本能过的 `sut/seed.py --reset` 直接失败
          #   —— 依赖集冲突。平台冒烟（test_09）因此不放在本 job，见文件末尾说明。
          pip install -r backend/requirements-test.txt
          pip list

      - name: 重建 SUT 数据库并灌种子数据
        # seed.py 是幂等的（--reset 会删库重建），所以不依赖任何手工造数据
        run: python sut/seed.py --reset

      - name: 启动 SUT 并等待就绪
        env:
          # ★ 必须开：否则「token 过期」「锁定到期」两组用例会 skip（假的绿色）
          SUT_ENABLE_TEST_HOOKS: "1"
        run: |
          mkdir -p logs
          nohup python sut/run.py > logs/sut.out 2>&1 &
          echo "SUT 已在后台启动（pid=$!）"
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8021/health > logs/health.json; then
              echo "SUT 就绪（第 ${i} 次探测）"
              cat logs/health.json
              exit 0
            fi
            sleep 1
          done
          echo "::error::SUT 在 30 秒内没有就绪"
          cat logs/sut.out
          exit 1

      # ---------------------------------------------------------------- 平台冒烟
      # ★ 平台冒烟（test_09，26 条，marker = platform）【不在本 job 运行】。原因：
      #     要跑它必须启动 backend/（Django），也就必须装 backend/requirements.txt；
      #     而 requirements-test.txt 明确规定「与 backend/requirements.txt 完全隔离、
      #     禁止合并」。实测合并后依赖集冲突，连 SUT 的 seed.py 都会失败。
      #   所以本 job 只跑 SUT 业务套件（175 条），pytest 默认加 `-m "not platform"`。
      #   平台冒烟目前是【本地套件】：cd lunarlink_tests; ..\backend\.venv\Scripts\python.exe -m pytest -m platform
      #   若要在 CI 也跑它，正确做法是【新增一个独立 job】，在该 job 里单独建虚拟环境、
      #   装 backend/requirements.txt（注意 mysqlclient 需要 libmysqlclient-dev，
      #   或改用 sqlite 时先剔除该行），再启动平台。

      - name: 执行 pytest
        working-directory: lunarlink_tests
        # ★ 用 `python -m pytest` 而不是裸 pytest，保证用的是当前解释器
        # ★ marker 为空时不传 -m：`-m ""` 在部分 pytest 版本上会被当成非法表达式
        run: |
          COMMON="--alluredir=allure-results --html=report.html --self-contained-html --junitxml=junit.xml"
          MARKER="${{ github.event.inputs.marker }}"
          if [ -n "$MARKER" ]; then
            echo ">>> 只跑 marker: $MARKER"
            set +e
            python -m pytest $COMMON -m "$MARKER" 2>&1 | tee pytest.out
            code=${PIPESTATUS[0]}
          else
            # ★ 默认排除 platform：平台冒烟需要后端完整运行时依赖，本 job 只装测试依赖
            #   （requirements-test.txt 明确要求与 backend/requirements.txt 隔离）。
            #   想在 CI 里跑 marker=platform，请见本文件末尾的说明。
            echo ">>> 全量执行（不含 platform）"
            set +e
            python -m pytest $COMMON -m "not platform" 2>&1 | tee pytest.out
            code=${PIPESTATUS[0]}
          fi
          # ★ 失败时把尾部摘要发成 annotation：workflow 运行日志的下载接口需要认证，
          #   而 annotation 在公开仓库上是可以被匿名读取的 —— 这样排查不必依赖本地权限。
          if [ "$code" -ne 0 ]; then
            echo "===== pytest 失败摘要（最后 40 行）====="
            tail -n 40 pytest.out
            tail -n 40 pytest.out | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::$line"
            done
          fi
          exit "$code"

      - name: 生成 Allure HTML
        if: always()
        # 说明：这里没有用 third-party 的 Allure Action，而是直接用官方 allure CLI
        #   （npm 包 allure-commandline，runner 上 Node 与 Java 都是预装的）。
        #   原因：simple-elf/allure-report-action 是 `using: docker` 且以「部署到 gh-pages
        #   并保留历史」为目标，而我们只要一份可下载的 HTML；用官方 CLI 每一步都可读、
        #   不引入无法在本地验证的第三方依赖。
        #   若你更想用那个 Action，替换下面这段即可（入参名称已核实）：
        #     - uses: simple-elf/allure-report-action@master
        #       with:
        #         allure_results: lunarlink_tests/allure-results
        #         allure_report: allure-report
        #         allure_history: allure-history
        #         gh_pages: gh-pages
        #         keep_reports: 20
        run: |
          npm install -g allure-commandline --silent
          allure --version
          # ★ 这里刻意【不加】 `|| true`：报告流水线坏掉本来就该是红的。
          #   若加 `|| true`，会出现「测试全绿但报告悄悄没了」这种最坏情况。
          allure generate lunarlink_tests/allure-results -o allure-report --clean
          ls -la allure-report | head -20

      - name: 输出用例统计
        if: always()
        working-directory: lunarlink_tests
        # ★ 不只 print，还要写进 GITHUB_STEP_SUMMARY：
        #   运行日志的下载接口需要认证（匿名 403），而 step summary 在 public 仓库上
        #   【匿名可读】并直接渲染在 run 页面。失败那一半已有 annotation 兜底，
        #   这里补上【成功】那一半 —— 让每次运行红绿都能看到 通过/失败/跳过 各多少。
        #   另一个作用：把「跳过了多少」变成公开事实。skipped 数量本身就是警示信号
        #   （例如后门没开会让绝大多数用例 skip，那是「假的绿色」的典型形态）。
        run: |
          STATS=$(python - <<'PY'
          import collections
          import glob
          import json
          import os

          counter = collections.Counter()
          for path in glob.glob("allure-results/*-result.json"):
              with open(path, encoding="utf-8") as fp:
                  counter[json.load(fp).get("status")] += 1

          total = sum(counter.values())
          print("总计 {} 条".format(total))
          for key in ("passed", "failed", "broken", "skipped", "unknown"):
              if counter.get(key):
                  print("  {:<8} {}".format(key, counter[key]))

          html = "report.html"
          if os.path.exists(html):
              print("pytest-html: {} bytes".format(os.path.getsize(html)))
          PY
          )
          echo "$STATS"

          # ★ 同时发成 notice annotation，与 step summary 是【互补】而不是替代：
          #     - step summary：渲染在 run 页面，人眼看得到，但【只能人眼看】
          #     - annotation  ：在 public 仓库上【可匿名读取】（实测 level=notice 也读得到），
          #                     即 `GET /repos/{owner}/{repo}/check-runs/{id}/annotations`
          #   为什么要两个都要：产物与运行日志的下载都要认证（401），
          #   所以「CI 到底跑了多少条」若只存在于页面/日志里，第三方就无法核实。
          #   发成 notice 后，任何人（包括没有仓库权限的）都能用 API 核到这几个数字。
          COMPACT=$(echo "$STATS" | tr '\n' ' ' | tr -s ' ')
          echo "::notice::CI 用例统计 —— ${COMPACT}"

          {
            echo "### 用例统计"
            echo '```'
            echo "$STATS"
            echo '```'
            echo "> 本 job 只跑业务套件（\`-m \"not platform\"\`）。平台冒烟 26 条是【本地套件】，"
            echo "> 原因见第 10 节 README / workflow 里 platform 那段说明。"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传报告
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: regression-report-allure
          path: allure-report
          # 版本选择依据：upload-artifact v6.0.0 明确声明 runs.using: node24，
          # 且要求 runner >= 2.327.1（GitHub 托管 runner 远高于此）。
          # 未跳最新 v7（发布于 2026-10-07，仅 3 天）—— 无收益、多一份新版本风险。
          if-no-files-found: warn
          retention-days: 30

      - name: 上传 pytest-html 与日志
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: regression-report-pytest
          path: |
            lunarlink_tests/report.html
            lunarlink_tests/junit.xml
            logs
          if-no-files-found: warn
          retention-days: 30
